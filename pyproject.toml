[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maba"
version = "1.0.0"
description = "Maba v1 Architecture: 101M parameter linear recurrence and attention model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.scripts]
maba = "maba.cli:main"

[tool.setuptools.packages.find]
include = ["maba*"]
